services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: khaneh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d khaneh"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/khaneh
      JWT_SECRET_KEY: change-me-in-production
      UPLOAD_FOLDER: /app/uploads
    ports: ["5000:5000"]
    depends_on:
      db:
        condition: service_healthy
    volumes: [uploads:/app/uploads]

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  postgres_data:
  uploads:
